[project]
name = "backend"
version = "0.0.0"
description = ""
authors = [
    {name = "MainSkown"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.136.3,<0.137.0",
    "uvicorn>=0.49.0,<0.50.0",
    "sqlmodel>=0.0.39,<0.0.40",
    "pgvector>=0.4.2,<0.5.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "psycopg2-binary>=2.9.12,<3.0.0",
    "docker>=7.1.0,<8.0.0",
    "websockets>=14.0,<16.0",
    "ollama>=0.6.2,<0.7.0",
    "langchain-ollama>=1.1.0,<2.0.0",
    "langgraph>=1.2.9,<2.0.0",
    "langgraph-checkpoint-postgres>=3.1.2,<4.0.0",
    "cvss>=3.6,<4.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "httpx>=0.27.0,<1.0.0",
    "testcontainers[postgres]>=4.8.1,<5.0.0",
    "pytest-timeout>=2.3.1,<3.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live_tools: real Docker/tool-execution integration tests (slow, needs Docker; see docs/testing-plan.md §1.4a) - excluded by default, run explicitly with -m live_tools",
]
addopts = "-m 'not live_tools' --import-mode=importlib"
# Every @pytest.mark.timeout(N) in this suite is a per-tool-call budget
# (nmap_scan should finish in N seconds, not "nmap_scan plus however long
# the shared session-scoped Docker fixtures took to build/pull this run").
# pytest-timeout's default (func_only=False) charges fixture setup/
# teardown against that same N, so on a cold CI runner - no cached layers
# for tests/integration/tools/conftest.py's pentest_tools_image, which
# pulls the full metasploitframework/metasploit-framework image and clones
# exploitdb from scratch - the first test to touch those fixtures blows
# its own small timeout mid-build, poisoning the session-scoped fixture
# for every other test in that package (all of them depend on it via the
# autouse _clean_live_kali_session_state fixture there). This makes every
# marker's timeout apply to the test body only, as intended.
timeout_func_only = true
# TestSession/TestSessionOutcome are application schema names, not pytest
# test classes - pytest's own name heuristic flags them on every module
# that imports test_session_scheme, which will only get noisier as more
# test files touch it.
filterwarnings = [
    "ignore:cannot collect test class 'TestSession'.*:pytest.PytestCollectionWarning",
    "ignore:cannot collect test class 'TestSessionOutcome'.*:pytest.PytestCollectionWarning",
]
