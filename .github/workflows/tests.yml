name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: cp ../.env.example .env

      - run: uv sync --group dev

      - run: uv run pytest --cov

  backend-tool-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: cp ../.env.example .env

      - run: uv sync --group dev

      - run: uv run pytest -m live_tools

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: dashboard/yarn.lock

      - run: yarn install --frozen-lockfile

      - run: yarn vitest run --coverage

      - run: yarn type-check
