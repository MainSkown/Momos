services:
  momos-backend:
    container_name: "momos-backend"
    build: 
      context: ./backend
      target: prod
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock # For spawning docker containers
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_HOST: ${POSTGRES_HOST:?set POSTGRES_HOST in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      OLLAMA_HOST: ${OLLAMA_HOST:?set OLLAMA_HOST in .env}
      OLLAMA_PORT: ${OLLAMA_PORT:?set OLLAMA_PORT in .env}
    depends_on:
      - db
      - ollama
    networks:
      - momos-net

  # The Frontend
  momos-dashboard:
    container_name: "momos-dashboard"
    build: 
      context: ./dashboard
      target: production-stage
    ports:
      - "8080:80"
    networks:
      - momos-net

  # The Memory & Data
  db:
    container_name: "momos-db"
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - momos-net

  # The LLM Engine
  ollama:
    container_name: "momos-ollama"
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - momos-net
    # If you have an NVIDIA GPU, uncomment these lines for massive speedups:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  momos-net:
    driver: bridge

volumes:
  db_data:
  ollama_data: